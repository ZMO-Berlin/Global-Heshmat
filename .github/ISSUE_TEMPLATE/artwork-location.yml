name: Report an artwork location
description: Help us locate a work by Hassan Heshmat, or tell us about one we have missed.
title: '[Artwork] '
labels: ['artwork report']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Several of Heshmat's works in public space have not
        been located yet, and others are almost certainly still unknown to us.

        If you would rather write privately, email **sonja.hegasy@zmo.de** instead.

        The project focuses on works in public space, with selected records of private
        sites and historical exhibitions where these document Heshmat's work.
        A listed location does not establish public access. Reports are reviewed by editors.
        This issue is public; use email for contact details or evidence you want to share privately.
  - type: input
    id: record-reference
    attributes:
      label: Existing record URL or ID
      description: Include the permanent entry URL or artwork/residence ID when available.
  - type: input
    id: observed-on
    attributes:
      label: When was this observed?
      description: Date or approximate period; distinguish a current sighting from historical documentation.
      placeholder: YYYY-MM-DD, circa YYYY, or unknown
  - type: input
    id: artwork
    attributes:
      label: Which artwork?
      description: The title as shown on the site, or a short description if it is a work we do not list yet.
      placeholder: e.g. "The Dawn of Egypt" — or "a bronze relief of two seated figures"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What are you reporting?
      options:
        - A location for a work listed as "not located"
        - A work missing from the site entirely
        - A correction to a location we already show
        - Something else
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: As precise as you can be — city, street, building, or coordinates.
      placeholder: e.g. "Cairo, Zamalek — in the courtyard of the officers' club" or a latitude, longitude pair
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How do you know?
      description: Photographs, publications, personal knowledge, a link — whatever you have. You can drag images directly into this box.
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: May we contact you?
      description: Optional. Say whether we may follow up through this issue; email the project privately to share contact details.
    validations:
      required: false
  - type: input
    id: image-credit
    attributes:
      label: Image credit and reuse terms
      description: Photographer or rights-holder name and any restrictions. Submission does not transfer ownership.
  - type: checkboxes
    id: rights
    attributes:
      label: Image rights
      options:
        - label: If I attached photographs, I am the rights-holder or have permission to share them, and the project may use them with attribution.
          required: false
